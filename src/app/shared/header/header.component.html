<header class="header-container">
  <div class="logo-area">
    @if (!logoFailed()) {
    <img src="logo.svg" alt="Jinx's Back-alley Game" class="header-logo" (error)="logoFailed.set(true)">
    } @else {
    <span class="text-logo">JINX'S <span>BACK-ALLEY</span></span>
    }
  </div>
  <button class="inventory-button" (click)="gameService.toggleInventory()" aria-label="Open inventory">
    🎒 <span class="label">Inventory</span>
    @if (gameService.gameState().inventory.length) {<span class="badge">{{ gameService.gameState().inventory.length }}</span>}
  </button>
</header>
