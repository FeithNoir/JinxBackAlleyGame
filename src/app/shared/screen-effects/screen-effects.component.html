<!-- Screen Flash Effect -->
@if (eventService.flashColor()) {
  <div class="screen-flash" [style.background-color]="eventService.flashColor()"></div>
}

<!-- Dynamic Scene Overlay (Night or Flashlight) -->
<div class="scene-overlay"
  [style.background]="overlayStyle().background"
  [style.pointer-events]="overlayStyle()['pointer-events']"
  [style.z-index]="overlayStyle()['z-index']">
</div>
