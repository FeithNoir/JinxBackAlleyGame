<div class="arcade-screen" [style.backgroundImage]="backgroundStyle">
    <div class="preview-area">
        @if (characterProps()) {
        <app-character [characterProps]="characterProps()" (interact)="onInteract($event)">
        </app-character>
        }
    </div>

    <button class="neo-btn" (click)="startClickerMiniGame()">Start Clicker Mini-Game</button>

    @if (miniGameService.isActive()) {
        <app-mini-game></app-mini-game>
    }
</div>
