<div class="game-layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <app-loading></app-loading>
  <app-header></app-header>
  <app-sidebar [(isCollapsed)]="sidebarCollapsed"></app-sidebar>
  <main class="game-main-content">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
  <app-inventory-modal
    [isOpen]="gameService.isInventoryOpen()"
    [inventory]="gameService.gameState().inventory"
    (close)="gameService.toggleInventory()">
  </app-inventory-modal>
</div>
